<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Étape 6 — Suppression des lignes sélectionnées</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="table_container">
    <h1>Étape 6 — Suppression des lignes sélectionnées</h1>

    <div id="form_container">
      <div class="form_group">
        <label class="form_label" for="form_nom">Nom :</label>
        <input type="text" id="form_nom" class="form_field">
      </div>

      <div class="form_group">
        <label class="form_label" for="form_prenom">Prénom :</label>
        <input type="text" id="form_prenom" class="form_field">
      </div>

      <div class="form_group">
        <label class="form_label" for="form_points">Points :</label>
        <input
          type="number"
          id="form_points"
          class="form_field"
          min="0"
          step="1"
        >
      </div>

      <button
        id="add_row"
        class="btn-add"
        type="button"
        onclick="doNewData()"
      >
        Ajouter
      </button>
    </div>

    <table id="persons_table">
      <thead>
        <tr>
          <th class="col_number">N°</th>
          <th class="col_text">Nom</th>
          <th class="col_text">Prénom</th>
          <th class="col_number">Points</th>
          <th class="col_chkbox">Select</th>
        </tr>
      </thead>
      <tbody id="persons_body"></tbody>
    </table>

    <div id="container_summary">
      <p id="p1">0 ligne(s)</p>
      <p id="p2"></p>
      <p id="p3">Total point(s) = 0</p>
    </div>

    <div id="container_btn">
      <button
        id="show_table"
        class="btn-consol"
        type="button"
        onclick="ConsoleTableau()"
      >
        Console Tableau
      </button>

      <button
        id="delete_selected"
        class="btn-del"
        type="button"
        onclick="deleteRow()"
      >
        Supprimer
      </button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
