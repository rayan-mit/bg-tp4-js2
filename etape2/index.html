<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Étape 2 — Insertion d’une ligne</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="table_container">
    <button id="add_row" type="button">Ajouter une nouvelle ligne</button>

    <table id="persons_table">
      <thead>
        <tr>
          <th class="col_number">N°</th>
          <th class="col_text">Nom</th>
          <th class="col_text">Prénom</th>
          <th class="col_number">Points</th>
          <th class="col_chkbox">Select</th>
        </tr>
      </thead>
      <tbody>
        <tr>
          <td class="col_number">1</td>
          <td class="col_text">nom1</td>
          <td class="col_text">prenom1</td>
          <td class="col_number">5</td>
          <td class="col_chkbox"><input type="checkbox"></td>
        </tr>
        <tr>
          <td class="col_number">2</td>
          <td class="col_text">nom2</td>
          <td class="col_text">prenom2</td>
          <td class="col_number">10</td>
          <td class="col_chkbox"><input type="checkbox"></td>
        </tr>
        <tr>
          <td class="col_number">3</td>
          <td class="col_text">nom3</td>
          <td class="col_text">prenom3</td>
          <td class="col_number">15</td>
          <td class="col_chkbox"><input type="checkbox"></td>
        </tr>
      </tbody>
    </table>
  </div>

  <script src="script.js"></script>
</body>
</html>
